<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/dufil-company-logo.png"><title>Carton Return Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--bd:#e0ded6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#9a988f;--bd:#383835;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#9a988f;--bd:#383835;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.card.alert{border-color:var(--bad);border-width:2px}
.big{font-size:26px;font-weight:600}.mu{color:var(--mu);font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bad);color:#fff}
.badge.ok{background:var(--ok)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.go{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:10px;cursor:pointer;align-self:end}
.edit{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:5px 8px;cursor:pointer;margin-right:4px}
.delete{background:transparent;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:5px 8px;cursor:pointer}
.edit:disabled,.delete:disabled{opacity:.5;cursor:wait}
.tw{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
body.login-mode{min-height:100vh}
body.login-mode main{width:100%;max-width:none;min-height:100vh;box-sizing:border-box;display:grid;place-items:center;padding:32px 20px}
#login{width:min(420px,100%);margin:auto}
.login-logo{display:flex;justify-content:center;margin:0 auto 18px}
.login-logo img{display:block;width:156px;height:auto;object-fit:contain}
.login-card{overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 28px rgba(40,32,20,.1)}
.login-panel{padding:28px}
.login-panel h2{margin:0 0 20px;font-size:22px}
#loginMsg{min-height:20px;margin-bottom:10px;color:var(--bad);font-size:13px}
#login form{grid-template-columns:1fr;gap:16px;padding:0;border:0;background:transparent}
#login label{gap:7px;font-size:12px;font-weight:650;color:var(--tx)}
#login input,#login select{min-height:48px;padding:10px 12px;border-color:var(--bd);border-radius:9px;background:var(--bg)}
#login input:focus,#login select:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
#login .go{min-height:48px;margin-top:4px;border-radius:9px;font-weight:700;letter-spacing:.01em}
@media(max-width:680px){
 body.login-mode main{padding:18px 14px}
 .login-panel{padding:24px}
}
</style></head><body class="login-mode"><main>
<section id="login"><div class="login-logo"><img src="dufil-company-logo.png" alt="Dufil Prima Foods logo" width="200" height="200"></div><div class="login-card">
<div class="login-panel">
<h2>Log in</h2>
<div id="loginMsg" role="status" aria-live="polite"></div>
<form id="loginForm">
<label>Email address<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button class="go">Log in</button>
 </form></div></div></section>
<div id="app" hidden>
<h1>Carton Return Tracker</h1>
<div id="msg" class="mu"></div>
<nav id="nav" hidden></nav><div id="view" hidden></div>
</div></main>
<script>
const F=["OTA","PHC","KADUNA","ABA"];
const C=["dispatch","shifts","returns","receipts"];
let D={dispatch:[],shifts:[],returns:[],receipts:[]},tab="Dashboard",user=null,token=sessionStorage.getItem("carton_token")||"",thr=500;
const $=s=>document.querySelector(s);
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const storageMessage=(result,action)=>{
 const messages=[`${action}.`];
 if(result.storageSync==="synced")messages.push("Saved to Google Sheets.");
 else if(result.storageSync==="failed"||result.storageSync==="not_configured")messages.push(result.storageMessage);
 else messages.push("Google Sheets save status could not be confirmed.");
 if(result.backupSync==="synced")messages.push("Firebase backup updated.");
 else if(result.backupSync==="failed"||result.backupSync==="not_configured")messages.push("Firebase backup warning: "+result.backupMessage);
 else messages.push("Firebase backup status could not be confirmed.");
 return messages.join(" ");
};
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const escapeHTML=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?escapeHTML(String(t).replace("T"," ")):"";
let editing=null;
const fopts=F.map(f=>`<option>${f}</option>`).join("");
const factoryField=()=>user.role==="seasoning"?`<label>Factory<select id="f_f">${fopts}</select></label>`:`<input id="f_f" type="hidden" value="${user.factory}">`;
function setAuthenticated(ready){
 $("#login").hidden=ready;
 $("#app").hidden=!ready;
 document.body.classList.toggle("login-mode",!ready);
 $("#nav").hidden=!ready;
 $("#view").hidden=!ready;
 if(!ready){$("#nav").replaceChildren();$("#view").replaceChildren()}
}
function stats(f){
 const s=D.shifts.filter(x=>x.f===f),r=D.returns.filter(x=>x.f===f),d=D.dispatch.filter(x=>x.f===f);
 const good=sum(s,"good");
 return{sent:sum(d,"qty"),used:sum(s,"used"),bad:sum(s,"bad"),good,returned:sum(r,"qty"),pile:good-sum(r,"qty"),
  trucksInTransit:r.filter(x=>!D.receipts.some(c=>c.rid===x.id)).length,
  transit:r.filter(x=>!D.receipts.some(c=>c.rid===x.id)).reduce((a,x)=>a+(+x.qty||0),0)}}
function truckEtaSummary(factory){
 const dispatches=D.dispatch.filter(x=>x.f===factory&&x.eta);
 const returns=D.returns.filter(x=>x.f===factory&&!D.receipts.some(c=>c.rid===x.id));
 const lines=[
  ...dispatches.map(x=>`Dispatch truck ${fmt(x.truck||"")}: ${fmt(x.eta)}`),
  ...returns.map(x=>`Return truck ${fmt(x.truck||"")}: ${fmt(x.eta||"ETA not entered")}`)
 ];
 return lines.length?lines.map(line=>`<div>${line}</div>`).join(""):`<div class="mu">No truck ETAs recorded</div>`;
}
const field=(id,l,t="text",ex="")=>`<label>${l}<input id="${id}" type="${t}" ${ex}></label>`;
const truckNumberField=()=>field("f_truck","Truck no","text",'autocapitalize="characters" autocomplete="off" spellcheck="false" pattern="[A-Za-z0-9]*"');
const wholeNumberField=(id,label,required=false)=>field(id,label,"text",`inputmode="numeric" pattern="[0-9]*" autocomplete="off"${required?" required":""}`);
const waybillField=()=>wholeNumberField("f_wb","Waybill no");
const calculatedNumberField=(id,label)=>field(id,label,"text",'inputmode="numeric" readonly');
const val=id=>$("#"+id).value;
function formHTML(kind){
 if(kind==="dispatch")return field("f_dt","Date & time","datetime-local",`value="${now()}"`)+factoryField()+truckNumberField()+waybillField()+field("f_qty","Cartons sent","number")+field("f_eta","ETA","datetime-local")+`<button class="go">Log dispatch</button>`;
 if(kind==="shifts")return field("f_date","Date","date",`value="${now().slice(0,10)}"`)+factoryField()+`<label>Shift<select id="f_sh"><option>A</option><option>B</option><option>C</option></select></label>`+wholeNumberField("f_used","Total cartons consumed",true)+wholeNumberField("f_good","Good cartons",true)+wholeNumberField("f_bad","Bad cartons",true)+`<div class="mu" style="grid-column:1/-1">Enter Good or Bad cartons first; the other is calculated from the total.</div><button class="go">Save shift</button>`;
 if(kind==="returns")return factoryField()+truckNumberField()+field("f_driver","Driver name")+field("f_ph","Driver phone")+waybillField()+field("f_qty","Cartons on truck","number")+field("f_dt","Dispatched","datetime-local",`value="${now()}"`)+field("f_eta","ETA","datetime-local")+`<button class="go">Log return truck</button>`;
 if(kind==="receipts"){const current=editing?.kind==="receipts"?D.receipts.find(x=>x.id===editing.id):null;const o=D.returns.filter(x=>!D.receipts.some(c=>c.rid===x.id)||x.id===current?.rid).map(x=>`<option value="${escapeHTML(x.id)}">${escapeHTML(x.f)} | ${escapeHTML(x.truck)} | ${escapeHTML(x.wb)} | ${escapeHTML(x.qty)}</option>`).join("");
  return `<label>Truck arrived<select id="f_rid">${o}</select></label>`+calculatedNumberField("f_acc","Accepted cartons (calculated)")+wholeNumberField("f_rej","Rejected")+field("f_dt","Received","datetime-local",`value="${now()}"`)+`<button class="go">Save sorting</button>`}
}
function rec(kind){
 if(kind==="dispatch")return{f:val("f_f"),truck:val("f_truck").toUpperCase(),wb:val("f_wb"),qty:+val("f_qty"),dt:val("f_dt"),eta:val("f_eta")};
 if(kind==="shifts")return{f:val("f_f"),date:val("f_date"),sh:val("f_sh"),used:+val("f_used"),good:+val("f_good"),bad:+val("f_bad")};
 if(kind==="returns")return{f:val("f_f"),truck:val("f_truck").toUpperCase(),driver:val("f_driver"),ph:val("f_ph"),wb:val("f_wb"),qty:+val("f_qty"),dt:val("f_dt"),eta:val("f_eta")};
 return{rid:val("f_rid"),acc:+val("f_acc"),rej:+val("f_rej"),dt:val("f_dt")};
}
const COLS={dispatch:[["dt","Date/time"],["eta","ETA"],["f","Factory"],["truck","Truck"],["wb","Waybill"],["qty","Qty"]],
 shifts:[["date","Date"],["sh","Shift"],["f","Factory"],["used","Used"],["good","Good"],["bad","Bad"]],
 returns:[["dt","Dispatched"],["eta","ETA"],["f","Factory"],["truck","Truck"],["driver","Driver"],["ph","Phone"],["wb","Waybill"],["qty","Qty"],["status","Status"]],
 receipts:[["dt","Received"],["f","Factory"],["truck","Truck"],["wb","Waybill"],["qty","Sent"],["acc","Accepted"],["rej","Rejected"]]};
function rows(kind,readOnly=false){
 let a=D[kind].slice();
 if(kind==="returns")a=a.map(x=>({...x,status:D.receipts.some(c=>c.rid===x.id)?"Received":"In transit"}));
 if(kind==="receipts")a=a.map(x=>{const r=D.returns.find(y=>y.id===x.rid)||{};return{...x,f:r.f,truck:r.truck,wb:r.wb,qty:r.qty}});
 a.sort((x,y)=>String(y.dt||y.date||"").localeCompare(String(x.dt||x.date||"")));
 const c=COLS[kind];
 const canManage=!readOnly&&(user.role==="seasoning"||["shifts","returns"].includes(kind));
 const actionHeader=canManage?"<th>Actions</th>":"";
 const rowHTML=a.map(r=>{
  const canManageRecord=canManage&&(user.role==="seasoning"||r.f===user.factory);
  const actions=canManageRecord?`<button class="edit" data-log-action="edit" data-log-kind="${kind}" data-log-id="${escapeHTML(r.id)}">Edit</button><button class="delete" data-log-action="delete" data-log-kind="${kind}" data-log-id="${escapeHTML(r.id)}">Delete</button>`:"";
  const action=canManage?`<td>${actions}</td>`:"";
  return `<tr>${c.map(x=>`<td>${fmt(r[x[0]]??"")}</td>`).join("")}${action}</tr>`;
 }).join("");
 return `<div class="tw"><table><tr>${c.map(x=>`<th>${x[1]}</th>`).join("")}${actionHeader}</tr>${rowHTML||`<tr><td class="mu" colspan="${c.length+(canManage?1:0)}">No entries yet</td></tr>`}</table></div>`}
function render(){
 if(!user)return;
 const tabs=user.role==="seasoning"
  ?["Dashboard","Seasoning dispatch","Return trucks tracking","Sorting at seasoning"]
  :["Dashboard","Seasoning dispatch","Noodle shift log","Return truck","Sorting at seasoning"];
 if(!tabs.includes(tab))tab="Dashboard";
 $("#nav").innerHTML=tabs.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("")+`<button id="logout">Log out</button>`;
 const kind={"Seasoning dispatch":"dispatch","Noodle shift log":"shifts","Return truck":"returns","Return trucks tracking":"returns","Sorting at seasoning":"receipts"}[tab];
 let h="";
 if(!kind){
  const factories=user.role==="seasoning"?F:[user.factory];
  h=(user.role==="seasoning"?`<label style="max-width:240px">Alert when good cartons pile up to (qty)<input id="thr" type="number" value="${thr}"></label><button class="go" id="checkGoogleSheets" type="button">Check Google Sheets</button><button class="go" id="syncFirebaseBackup" type="button">Sync Firebase backup</button><button class="go" id="migrateUpstash" type="button">Import existing Upstash data</button>`:"")+`<h2>${user.role==="seasoning"?"Per noodle factory":user.factory+" factory"}</h2><div class="grid">`+factories.map(f=>{const s=stats(f),al=s.pile>=thr;
   const transit=user.role==="seasoning"
    ?` | Trucks in transit ${s.trucksInTransit} (${s.transit} cartons)`
    :` | In transit ${s.transit}`;
   return `<div class="card ${al?"alert":""}"><b>${f}</b> ${al?'<span class="badge">Ready to return</span>':'<span class="badge ok">OK</span>'}<div class="big">${s.pile}</div><div class="mu">good cartons waiting to return</div><div class="mu">Sent ${s.sent} | Used ${s.used} | Bad ${s.bad}<br>Returned ${s.returned}${transit}</div>${user.role==="seasoning"?`<div class="mu"><b>Truck ETAs</b>${truckEtaSummary(f)}</div>`:""}</div>`}).join("")+`</div>`+(user.role==="seasoning"?"":`<h2>Trucks on the way back</h2>${rows("returns")}`);
 }else{
  const isSeasoningReturnTracking=user.role==="seasoning"&&tab==="Return trucks tracking";
  const canUpdate=!isSeasoningReturnTracking&&(user.role==="seasoning"||["shifts","returns"].includes(kind));
  h=(canUpdate?`<form id="frm">${editing?.kind===kind?`<div style="grid-column:1/-1">Editing log <button type="button" class="edit" id="cancelEdit">Cancel</button></div>`:""}${formHTML(kind)}</form>`:"")+rows(kind,isSeasoningReturnTracking);
 }
 $("#view").innerHTML=h;
 for(const input of $("#view").querySelectorAll("#f_good,#f_bad,#f_rej,#f_wb,#f_used")){
  input.onbeforeinput=event=>{
   if(event.inputType==="insertText"&&event.data&&/\D/.test(event.data))event.preventDefault();
  };
  input.oninput=()=>{
   const caret=input.selectionStart??input.value.length;
   const position=input.value.slice(0,caret).replace(/\D/g,"").length;
   input.value=input.value.replace(/\D/g,"");
   input.setSelectionRange(position,position);
  };
 }
 const truckInput=$("#f_truck");if(truckInput)truckInput.oninput=()=>{
  const caret=truckInput.selectionStart??truckInput.value.length;
  const position=truckInput.value.slice(0,caret).replace(/[^a-z0-9]/gi,"").length;
  truckInput.value=truckInput.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  truckInput.setSelectionRange(position,position);
 };
 if(editing&&editing.kind===kind){
  const record=D[kind].find(item=>item.id===editing.id);
  const fields={dispatch:{f:"f_f",truck:"f_truck",wb:"f_wb",qty:"f_qty",dt:"f_dt",eta:"f_eta"},shifts:{f:"f_f",date:"f_date",sh:"f_sh",used:"f_used",good:"f_good",bad:"f_bad"},returns:{f:"f_f",truck:"f_truck",driver:"f_driver",ph:"f_ph",wb:"f_wb",qty:"f_qty",dt:"f_dt",eta:"f_eta"},receipts:{rid:"f_rid",acc:"f_acc",rej:"f_rej",dt:"f_dt"}}[kind];
  if(record)for(const [key,id] of Object.entries(fields)){const input=$("#"+id);if(input)input.value=key==="truck"?String(record[key]??"").toUpperCase().replace(/[^A-Z0-9]/g,""):record[key]??""}
  const submit=$("#frm .go");if(submit)submit.textContent="Save changes";
 }
 let shiftCartonInputMode=null;
 const updateCalculatedCartons=()=>{
  const totalInput=$("#f_used"),badInput=$("#f_bad"),goodOutput=$("#f_good");
  if(totalInput&&badInput&&goodOutput){
   const total=totalInput.value===""?null:Number(totalInput.value);
   const driver=shiftCartonInputMode==="good"?goodOutput:badInput;
   const calculated=shiftCartonInputMode==="good"?badInput:goodOutput;
   const entered=driver.value===""?null:Number(driver.value);
   const valid=Number.isSafeInteger(total)&&Number.isSafeInteger(entered)&&total>=0&&entered>=0&&entered<=total;
   if(shiftCartonInputMode!==null)calculated.value=valid?String(total-entered):"";
   goodOutput.readOnly=shiftCartonInputMode==="bad";
   badInput.readOnly=shiftCartonInputMode==="good";
  }
  const truckInput=$("#f_rid"),rejectedInput=$("#f_rej"),acceptedOutput=$("#f_acc");
  if(truckInput&&rejectedInput&&acceptedOutput){
   const truck=D.returns.find(record=>record.id===truckInput.value);
   const total=truck?Number(truck.qty):null;
   const rejected=rejectedInput.value===""?0:Number(rejectedInput.value);
   acceptedOutput.value=Number.isSafeInteger(total)&&Number.isSafeInteger(rejected)&&total>=0&&rejected>=0&&rejected<=total?String(total-rejected):"";
  }
 };
 for(const id of ["#f_used","#f_bad","#f_rid","#f_rej"]){
  const input=$(id);if(input)input.addEventListener("input",updateCalculatedCartons);
  if(input&&id==="#f_rid")input.addEventListener("change",updateCalculatedCartons);
 }
 const goodInput=$("#f_good"),badInput=$("#f_bad");
 if(goodInput)goodInput.addEventListener("input",()=>{shiftCartonInputMode="good";updateCalculatedCartons()});
 if(badInput)badInput.addEventListener("input",()=>{shiftCartonInputMode="bad";updateCalculatedCartons()});
 updateCalculatedCartons();
 document.querySelectorAll("nav button[data-t]").forEach(b=>b.onclick=()=>{editing=null;tab=b.dataset.t;render()});
 const logout=$("#logout");logout.onclick=()=>{token="";user=null;editing=null;sessionStorage.removeItem("carton_token");$("#loginMsg").textContent="You have been logged out.";setAuthenticated(false)};
 const t=$("#thr");if(t)t.onchange=async()=>{
  thr=+t.value||0;render();
  try{
   const result=await api("POST",{kind:"settings",rec:{thr}});
   if(result.storageSync!=="synced")$("#msg").textContent=result.storageMessage;
  }catch(error){$("#msg").textContent="Settings update failed: "+error.message}
 };
 const sheetsButton=$("#checkGoogleSheets");if(sheetsButton)sheetsButton.onclick=async()=>{
  sheetsButton.disabled=true;
  try{
   const result=await api("POST",{action:"checkGoogleSheets"});
   $("#msg").textContent=result.sheetsMessage;
  }catch(error){
   $("#msg").textContent="Google Sheets check failed: "+error.message;
  }finally{sheetsButton.disabled=false}
 };
 const backupButton=$("#syncFirebaseBackup");if(backupButton)backupButton.onclick=async()=>{
  backupButton.disabled=true;
  try{
   const result=await api("POST",{action:"syncFirebaseBackup"});
   $("#msg").textContent=result.backupMessage;
  }catch(error){
   $("#msg").textContent="Firebase backup failed: "+error.message;
  }finally{backupButton.disabled=false}
 };
 const migrationButton=$("#migrateUpstash");if(migrationButton)migrationButton.onclick=async()=>{
  if(!window.confirm("Import existing Upstash records into Google Sheets and Firebase? This one-time import merges rows and cannot be run again after it completes."))return;
  migrationButton.disabled=true;
  try{
   const result=await api("POST",{action:"migrateUpstash"});
   $("#msg").textContent=result.migrationMessage+(result.backupSync==="failed"?` Firebase backup warning: ${result.backupMessage}`:"");
  }catch(error){
   $("#msg").textContent="Upstash import failed: "+error.message;
  }finally{migrationButton.disabled=false}
 };
 const fm=$("#frm");if(fm)fm.onsubmit=async e=>{
  e.preventDefault();
  const currentEdit=editing?.kind===kind?editing:null;
  try{
   const result=await api("POST",currentEdit?{action:"edit",kind,id:currentEdit.id,rec:rec(kind)}:{kind,rec:rec(kind)});
   editing=null;
   await load();
   $("#msg").textContent=storageMessage(result,currentEdit?"Log updated":"Log saved");
  }catch(x){$("#msg").textContent=(currentEdit?"Edit":"Save")+" failed: "+x.message}
 };
 const cancelEdit=$("#cancelEdit");if(cancelEdit)cancelEdit.onclick=()=>{editing=null;render()};
 $("#view").querySelectorAll("button[data-log-action]").forEach(button=>button.onclick=async()=>{
  const action=button.dataset.logAction,kind=button.dataset.logKind,id=button.dataset.logId;
  const record=D[kind].find(item=>item.id===id);
  if(!record){$("#msg").textContent="Action failed: record not found. Refresh and try again.";return}
  if(action==="edit"){
   editing={kind,id};
   tab=({dispatch:"Seasoning dispatch",shifts:"Noodle shift log",returns:"Return truck",receipts:"Sorting at seasoning"})[kind];
   render();
   return;
  }
  const detail=kind==="returns"?" Any sorting receipt for this return will also be deleted.":"";
  if(!window.confirm(`Delete this ${kind==="shifts"?"shift":kind==="returns"?"return truck":kind==="receipts"?"sorting":"dispatch"} log? This cannot be undone.${detail}`))return;
  button.disabled=true;
  try{
   const result=await api("POST",{action:"delete",kind,id});
   editing=null;
   await load();
   $("#msg").textContent=storageMessage(result,"Log deleted");
  }catch(error){
   $("#msg").textContent="Delete failed: "+error.message;
   button.disabled=false;
  }
 });
}
async function api(m,body,authenticate=true){
 const headers={"content-type":"application/json"};
 if(authenticate&&token)headers.authorization=`Bearer ${token}`;
 const r=await fetch("/api/handler",{method:m,headers,body:body?JSON.stringify(body):undefined});
