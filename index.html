<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/dufil-company-logo.png"><title>Carton Return Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--bd:#e0ded6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#9a988f;--bd:#383835;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#9a988f;--bd:#383835;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px}
.app-header{margin-bottom:12px}
.app-header h1{margin:0}
.theme-switch{position:fixed;top:12px;right:12px;z-index:10;display:flex;gap:4px;padding:3px;border:1px solid var(--bd);background:var(--card);border-radius:9px}
.theme-switch button{padding:6px 10px;border:0;border-radius:6px;background:transparent;color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.theme-switch button[aria-pressed="true"]{background:var(--ac);color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.card.alert{border-color:var(--bad);border-width:2px}
.big{font-size:26px;font-weight:600}.mu{color:var(--mu);font-size:13px}
.dashboard-tools{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:14px 0 20px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.dashboard-tools label{min-width:190px;flex:1}
.dashboard-tools button{min-height:40px}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-heading h2{margin:0}
.factory-grid{grid-auto-columns:minmax(min(100%,640px),1fr);grid-auto-flow:column;grid-template-columns:none;gap:14px;overflow-x:auto;padding:0 2px 10px}
.factory-card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;column-gap:14px;padding:16px;border-radius:12px}
.factory-card.alert{border-color:var(--bad)}
.factory-card-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.factory-card-head strong{font-size:17px}
.return-performance{grid-column:1/-1;margin:14px 0 8px}
.factory-total{grid-column:1}
.factory-metrics-heading,.factory-metrics{grid-column:2}
.factory-metrics-heading{align-self:end}
.factory-acceptance,.factory-etas{grid-column:1/-1}
.return-performance h3,.factory-acceptance h3,.factory-metrics-heading{margin:0 0 9px;font-size:13px}
.return-rate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.return-rate-card{display:flex;min-width:0;flex-direction:column;gap:4px;padding:12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.return-rate-card>span:first-child{color:var(--mu);font-size:12px;font-weight:650}
.return-rate-card strong{margin-top:4px;color:var(--tx);font-size:clamp(18px,2vw,26px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.return-rate-card small{color:var(--mu);font-size:12px}
.return-rate-card .return-rate{margin-top:5px;padding-top:7px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
.return-rate-card .return-rate b{color:var(--ac);font-size:14px}
.factory-metrics-heading{margin:16px 0 8px}
.factory-metrics{display:grid;grid-auto-columns:minmax(100px,1fr);grid-auto-flow:column;grid-template-columns:none;gap:8px;overflow-x:auto}
.factory-metric{min-width:0;padding:9px;background:var(--bg);border-radius:8px}
.factory-metric span{display:block;color:var(--mu);font-size:12px}
.factory-metric strong{display:block;margin-top:3px;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.factory-metric small{display:block;margin-top:2px;color:var(--mu);font-size:11px}
.factory-total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;padding:14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.factory-total strong{font-size:clamp(20px,2.4vw,30px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.factory-acceptance{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.acceptance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acceptance-metric{padding:10px;background:var(--bg);border-radius:8px}
.acceptance-metric span,.acceptance-metric small{display:block;color:var(--mu);font-size:12px}
.acceptance-metric strong{display:block;margin-top:4px;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acceptance-metric small{margin-top:3px;font-size:11px}
.factory-etas{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.factory-etas summary{color:var(--ac);font-size:13px;font-weight:600;cursor:pointer}
.factory-eta-list{display:grid;gap:5px;margin-top:8px;color:var(--mu);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bad);color:#fff}
.badge.ok{background:var(--ok)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.go{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:10px;cursor:pointer;align-self:end}
.edit{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:5px 8px;cursor:pointer;margin-right:4px}
.delete{background:transparent;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:5px 8px;cursor:pointer}
.edit:disabled,.delete:disabled{opacity:.5;cursor:wait}
.tw{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
body.login-mode{min-height:100vh}
body.login-mode main{width:100%;max-width:none;min-height:100vh;box-sizing:border-box;display:grid;place-items:center;padding:32px 20px}
#login{width:min(420px,100%);margin:auto}
.login-logo{display:flex;justify-content:center;margin:0 auto 18px}
.login-logo img{display:block;width:156px;height:auto;object-fit:contain}
.login-card{overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 28px rgba(40,32,20,.1)}
.login-panel{padding:28px}
.login-panel h2{margin:0 0 20px;font-size:22px}
#loginMsg{min-height:20px;margin-bottom:10px;color:var(--bad);font-size:13px}
#login form{grid-template-columns:1fr;gap:16px;padding:0;border:0;background:transparent}
#login label{gap:7px;font-size:12px;font-weight:650;color:var(--tx)}
#login input,#login select{min-height:48px;padding:10px 12px;border-color:var(--bd);border-radius:9px;background:var(--bg)}
#login .password-control{position:relative;display:flex}
#login .password-control input{width:100%;padding-right:52px}
#login .password-toggle{position:absolute;top:50%;right:4px;display:grid;width:40px;height:40px;place-items:center;transform:translateY(-50%);border:0;border-radius:6px;background:transparent;color:var(--mu);cursor:pointer}
#login .password-toggle:hover{color:var(--tx)}
#login .password-toggle:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#login .password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
#login input:focus,#login select:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
#login .go{min-height:48px;margin-top:4px;border-radius:9px;font-weight:700;letter-spacing:.01em}
.savings-monthly-card{margin-bottom:14px}
.savings-monthly-card .section-heading{margin-bottom:8px;align-items:center}
.savings-monthly-card .section-heading .go{padding:8px 12px;align-self:auto}
.savings-monthly-table th,.savings-monthly-table td{vertical-align:middle}
.savings-monthly-table input{width:110px;min-width:96px;padding:6px;box-sizing:border-box}
.savings-total-row th,.savings-total-row td{border-top:2px solid var(--bd);background:var(--bg)}
.savings-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.savings-card{display:grid;gap:12px;align-content:start}
.savings-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.savings-summary-card{margin-top:14px}
.savings-overall{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
.savings-totals{display:grid;gap:8px}
.savings-chart-panel{display:grid;gap:8px;justify-items:center;text-align:center}
.savings-chart-panel h3{margin:0;font-size:14px}
.chart-wrap{display:grid;gap:10px;justify-items:center;width:100%}
.savings-chart{max-width:100%;height:auto}
.chart-legend{display:grid;gap:6px;width:100%;max-width:280px;text-align:left}
.chart-legend-item{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:13px}
.chart-swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart-empty{display:grid;place-items:center;min-height:180px;width:100%;max-width:220px;padding:16px;border:1px dashed var(--bd);border-radius:10px;color:var(--mu);font-size:13px}
.chart-center-note{font-size:13px}
.savings-total strong{font-size:18px;color:var(--ac)}
@media(max-width:680px){
 body.login-mode main{padding:18px 14px}
 .login-panel{padding:24px}
 .dashboard-tools{align-items:stretch}
 .dashboard-tools label,.dashboard-tools button{width:100%}
 .factory-card{padding:13px}
 .factory-card{grid-template-columns:minmax(0,1fr)}
 .factory-card-head,.return-performance,.factory-total,.factory-metrics-heading,.factory-metrics,.factory-acceptance,.factory-etas{grid-column:1}
 .return-rate-grid{gap:6px}
 .return-rate-card{padding:9px}
 .return-rate-card strong{font-size:22px}
}
</style></head><body class="login-mode"><div class="theme-switch" role="group" aria-label="Color theme"><button id="themeLight" type="button" aria-pressed="false">Light</button><button id="themeDark" type="button" aria-pressed="false">Dark</button></div><main>
<section id="login"><div class="login-logo"><img src="dufil-company-logo.png" alt="Dufil Prima Foods logo" width="200" height="200"></div><div class="login-card">
<div class="login-panel">
<h2>Log in</h2>
<div id="loginMsg" role="status" aria-live="polite"></div>
<form id="loginForm">
<label>Plant<select id="plant" required><option value="">Select plant</option><option value="KADUNA">KADUNA</option><option value="OTA">OTA</option><option value="PHC">PHC</option><option value="SEASONING">Seasoning</option></select></label>
<label id="teamField" hidden>Team<select id="team" required><option value="warehouse">WAREHOUSE</option><option value="sorting">SORTING TEAM</option></select></label>
<label id="passwordField" hidden>Password<span class="password-control"><input id="password" type="password" autocomplete="current-password" required><button id="passwordToggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="passwordEyeSlash" d="m4 4 16 16" hidden/></svg></button></span></label>
<button class="go">Log in</button>
 </form></div></div></section>
<div id="app" hidden>
 <header class="app-header"><h1>Carton Return Tracker</h1></header>
<div id="msg" class="mu"></div>
<nav id="nav" hidden></nav><div id="view" hidden></div>
</div></main>
<script>
const F=["OTA","PHC","KADUNA"];
const C=["dispatch","shifts","returns","receipts"];
let D={dispatch:[],shifts:[],returns:[],receipts:[]},tab="Dashboard",user=null,token=sessionStorage.getItem("carton_token")||"",thr=500,renderedPeriod="",savingsByMonth={};
let selectedFactory=F[0];
const $=s=>document.querySelector(s);
const normalizeFactoryName=factory=>{
 if(typeof factory!=="string")return factory;
 const normalized=factory.replace(/\s+/g,"").toUpperCase();
 return normalized==="OA"?"OTA":normalized;
};
$("#plant").onchange=()=>{
 const selectedPlant=$("#plant").value;
 $("#teamField").hidden=!selectedPlant||selectedPlant==="SEASONING";
 $("#passwordField").hidden=!selectedPlant;
 const sortingOption=$("#team").querySelector('option[value="sorting"]');
 sortingOption.disabled=selectedPlant==="SEASONING";
 if(sortingOption.disabled&&$("#team").value==="sorting")$("#team").value="warehouse";
};
$("#plant").onchange();
const normalizeFactoryRecord=record=>{
 const factory=normalizeFactoryName(record.f);
 return factory===record.f?record:{...record,f:factory};
};
const systemTheme=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
const themeKey=username=>`carton_theme_${encodeURIComponent(username)}`;
let loginThemeChoice=null;
function setTheme(theme,persist=false){
 document.documentElement.dataset.theme=theme;
 $("#themeLight").setAttribute("aria-pressed",String(theme==="light"));
 $("#themeDark").setAttribute("aria-pressed",String(theme==="dark"));
 if(persist){
  if(user?.username)localStorage.setItem(themeKey(user.username),theme);
  else loginThemeChoice=theme;
 }
}
function applyThemeForCurrentUser(){
 let theme=systemTheme;
 if(user?.username){
  let preference=localStorage.getItem(themeKey(user.username));
  if(!["light","dark"].includes(preference)&&["light","dark"].includes(loginThemeChoice)){
   preference=loginThemeChoice;
   localStorage.setItem(themeKey(user.username),preference);
  }
  if(["light","dark"].includes(preference))theme=preference;
 }
 loginThemeChoice=null;
 setTheme(theme);
}
applyThemeForCurrentUser();
$("#themeLight").onclick=()=>setTheme("light",true);
$("#themeDark").onclick=()=>setTheme("dark",true);
$("#passwordToggle").onclick=()=>{
 const password=$("#password"),visible=password.type==="password";
 password.type=visible?"text":"password";
 $("#passwordToggle").setAttribute("aria-label",visible?"Hide password":"Show password");
 $("#passwordToggle").setAttribute("aria-pressed",String(visible));
 $("#passwordEyeSlash").hidden=!visible;
};
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const storageMessage=action=>`${action}.`;
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const escapeHTML=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?escapeHTML(String(t).replace(/^(\d{4}-\d{2}-\d{2})T/,"$1 ")):"";
let editing=null;
const FACTORY_LINE_OPTIONS={OTA:[1,2,3,4,5,6],PHC:[1,2,3,4,5,6,7,8,9],KADUNA:[1,2,3,4,5,6]};
const FACTORY_SHIFT_OPTIONS={OTA:[1,2],PHC:[1,2,3],KADUNA:[1,2]};
const SORTER_OPTIONS={OTA:["Kingsley","Ayo"],PHC:["Jollof","Chicken","Onion"],KADUNA:["Innocent","Anthony"]};
const factoryField=()=>user.role==="seasoning"?`<label>Factory<select id="f_f">${F.map(f=>`<option${f===selectedFactory?" selected":""}>${f}</option>`).join("")}</select></label>`:`<input id="f_f" type="hidden" value="${user.factory}">`;
const lineSelectField=(factory=selectedFactory,currentValue="",disabled=false)=>{
 const choices=FACTORY_LINE_OPTIONS[factory]||[];
 return `<label>Line<select id="f_line" required${disabled?" disabled":""}>${["<option value=\"\">Select line</option>",...choices.map(line=>`<option value="${line}"${String(currentValue)===String(line)?" selected":""}>${line}</option>`)].join("")}</select></label>`;
};
function setAuthenticated(ready){
 $("#login").hidden=ready;
 $("#app").hidden=!ready;
 document.body.classList.toggle("login-mode",!ready);
 $("#nav").hidden=!ready;
 $("#view").hidden=!ready;
 if(!ready){$("#nav").replaceChildren();$("#view").replaceChildren()}
}
function stats(f){
 const s=D.shifts.filter(x=>x.f===f&&["used","good","bad"].every(key=>Number.isSafeInteger(x[key]))),r=D.returns.filter(x=>x.f===f),d=D.dispatch.filter(x=>x.f===f);
 const good=sum(s,"good");
 const today=new Date(),month=now().slice(0,7),year=month.slice(0,4);
 const lastMonthDate=new Date(today.getFullYear(),today.getMonth()-1,1);
 const lastMonth=lastMonthDate.getFullYear()+"-"+String(lastMonthDate.getMonth()+1).padStart(2,"0");
 const sentThisMonth=sum(d.filter(x=>String(x.dt||"").slice(0,7)===month),"qty");
 const returnedThisMonth=sum(r.filter(x=>String(x.dt||"").slice(0,7)===month),"qty");
 const sentLastMonth=sum(d.filter(x=>String(x.dt||"").slice(0,7)===lastMonth),"qty");
 const returnedLastMonth=sum(r.filter(x=>String(x.dt||"").slice(0,7)===lastMonth),"qty");
 const sentThisYear=sum(d.filter(x=>String(x.dt||"").slice(0,4)===year),"qty");
 const returnedThisYear=sum(r.filter(x=>String(x.dt||"").slice(0,4)===year),"qty");
 const acceptedForPeriod=period=>sum(D.receipts.filter(receipt=>
  isSortedReceipt(receipt)&&String(receipt.acceptedAt||receipt.dt||"").slice(0,period.length)===period
  &&r.some(returnRecord=>returnRecord.id===receipt.rid)
 ),"acc");
 const acceptedThisMonth=acceptedForPeriod(month);
 const acceptedLastMonth=acceptedForPeriod(lastMonth);
 const acceptedThisYear=acceptedForPeriod(year);
 return{sent:sum(d,"qty"),used:sum(s,"used"),bad:sum(s,"bad"),good,returned:sum(r,"qty"),pile:good-sum(r,"qty"),
  returnMonth:sentThisMonth?returnedThisMonth/sentThisMonth*100:null,
  returnedThisMonth,
  returnLastMonth:sentLastMonth?returnedLastMonth/sentLastMonth*100:null,
  returnedLastMonth,
  returnYear:sentThisYear?returnedThisYear/sentThisYear*100:null,
  returnedThisYear,
  acceptedThisMonth,
  acceptedLastMonth,
  acceptedThisYear,
  acceptanceMonth:sentThisMonth?acceptedThisMonth/sentThisMonth*100:null,
  acceptanceLastMonth:sentLastMonth?acceptedLastMonth/sentLastMonth*100:null,
  acceptanceYear:sentThisYear?acceptedThisYear/sentThisYear*100:null,
  trucksInTransit:r.filter(x=>!D.receipts.some(c=>c.rid===x.id)).length,
  transit:r.filter(x=>!D.receipts.some(c=>c.rid===x.id)).reduce((a,x)=>a+(+x.qty||0),0)}}
const percent=value=>value===null?"—":`${value.toFixed(1)}%`;
function returnRateSummary(s){
 const today=new Date();
 const month=today.toLocaleString(undefined,{month:"long",year:"numeric"});
 const lastMonth=new Date(today.getFullYear(),today.getMonth()-1,1).toLocaleString(undefined,{month:"long",year:"numeric"});
 const year=today.getFullYear();
 const periodCard=(label,quantity,rate)=>`<div class="return-rate-card"><span>${label}</span><strong>${quantity.toLocaleString()}</strong><small>cartons returned</small><div class="return-rate">Return rate <b>${rate===null?"—":percent(rate)}</b>${rate===null?" · no dispatches yet":" · of cartons sent"}</div></div>`;
 return `<section class="return-performance"><h3>Cartons returned</h3><div class="return-rate-grid">${periodCard(`MTD · ${month}`,s.returnedThisMonth,s.returnMonth)}${periodCard(`Last month · ${lastMonth}`,s.returnedLastMonth,s.returnLastMonth)}${periodCard(`Calendar year · ${year}`,s.returnedThisYear,s.returnYear)}</div></section>`;
}
function acceptanceSummary(s,showLastMonth=false){
 const today=new Date();
 const month=today.toLocaleString(undefined,{month:"long",year:"numeric"});
 const lastMonth=new Date(today.getFullYear(),today.getMonth()-1,1).toLocaleString(undefined,{month:"long",year:"numeric"});
 const year=today.getFullYear();
 if(!showLastMonth)return `<section class="factory-acceptance"><h3>Carton acceptance at Seasoning</h3><div class="acceptance-grid"><div class="acceptance-metric"><span>MTD · ${month}</span><strong>${percent(s.acceptanceMonth)}</strong><small>${s.acceptedThisMonth.toLocaleString()} cartons accepted of dispatched</small></div><div class="acceptance-metric"><span>Calendar year · ${year}</span><strong>${percent(s.acceptanceYear)}</strong><small>${s.acceptedThisYear.toLocaleString()} cartons accepted of dispatched</small></div></div></section>`;
 const periodCard=(label,quantity,rate)=>`<div class="return-rate-card"><span>${label}</span><strong>${quantity.toLocaleString()}</strong><small>cartons accepted</small><div class="return-rate">Acceptance rate <b>${rate===null?"—":percent(rate)}</b>${rate===null?" · no dispatches yet":" · of cartons sent"}</div></div>`;
 return `<section class="return-performance"><h3>Accepted by Seasoning</h3><div class="return-rate-grid">${periodCard(`MTD · ${month}`,s.acceptedThisMonth,s.acceptanceMonth)}${periodCard(`Last month · ${lastMonth}`,s.acceptedLastMonth,s.acceptanceLastMonth)}${periodCard(`Calendar year · ${year}`,s.acceptedThisYear,s.acceptanceYear)}</div></section>`;
}
function truckEtaSummary(factory){
 const dispatches=D.dispatch.filter(x=>x.f===factory&&x.eta);
 const returns=D.returns.filter(x=>x.f===factory&&!D.receipts.some(c=>c.rid===x.id));
 const lines=[
  ...dispatches.map(x=>`Dispatch · ${fmt(x.truck||"Truck")}: ${fmt(x.eta)}`),
  ...returns.map(x=>`Return · ${fmt(x.truck||"Truck")}: ${fmt(x.eta||"ETA not entered")}`)
 ];
 return lines.length

function acceptedCartonsByMonth(factory,year){

function savingsYearRows(year){

 return Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,"0")}`).map(month=>{
  const input=(savingsByMonth&&savingsByMonth[month])||{};
  const wac=savingsAmount(Number(input.wac));
  const sorting=savingsAmount(Number(input.sortingCost));
  const haulagePhc=savingsAmount(Number(input.haulagePhc));
  const haulageKaduna=savingsAmount(Number(input.haulageKaduna));
  const factories=Object.fromEntries(F.map(f=>{
   const acc=accepted[f][month]||0;
   const haulage=f==="PHC"?haulagePhc:f==="KADUNA"?haulageKaduna:0;
   const gross=acc*wac;
   const appliedSorting=acc?sorting:0;
   const appliedHaulage=acc?haulage:0;
   const savings=acc?gross-appliedSorting-appliedHaulage:0;
   return [f,{acc,wac,sorting:appliedSorting,haulage:appliedHaulage,gross,savings}];
  }));
  const totalSavings=F.reduce((s,f)=>s+factories[f].savings,0);
  return {month,wac,sorting,haulagePhc,haulageKaduna,factories,totalSavings};
 });
}

function savingsPieChart(items,size=220,innerRadius=0,title=""){
 const total=items.reduce((sum,item)=>sum+Math.max(0,item.value),0);
 const cx=size/2,cy=size/2,r=size/2-10;
 const colors={OTA:"#c2410c",PHC:"#0f766e",KADUNA:"#2563eb"};
 const polar=(angle,radius)=>({x:cx+radius*Math.cos(angle),y:cy+radius*Math.sin(angle)});
 const slices=items.map(item=>({...item,value:Math.max(0,item.value),color:colors[item.factory]||"#6b6a65"})).filter(item=>item.value>0);
 if(!total||!slices.length)return `<div class="chart-empty" role="img" aria-label="${escapeHTML(title||"Chart")}">No positive savings to chart</div>`;
 let start=-Math.PI/2;
 const paths=slices.length===1?(()=>{
  const c=colors[slices[0].factory]||"#6b6a65";
  if(innerRadius>0)return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"></circle><circle cx="${cx}" cy="${cy}" r="${innerRadius}" fill="var(--card)"></circle>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"></circle>`;
 })():slices.map(item=>{
  const angle=item.value/total*Math.PI*2;
  const end=start+angle;
  const large=angle>Math.PI?1:0;
  const p1=polar(start,r),p2=polar(end,r);
  let d="";
  if(innerRadius>0){
   const i1=polar(end,innerRadius),i2=polar(start,innerRadius);
   d=`M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y} L ${i1.x} ${i1.y} A ${innerRadius} ${innerRadius} 0 ${large} 0 ${i2.x} ${i2.y} Z`;
  }else{
   d=`M ${cx} ${cy} L ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y} Z`;
  }
  start=end;
  return `<path d="${d}" fill="${item.color}"><title>${escapeHTML(item.factory)}: ${savingsMoney(item.value)}</title></path>`;
 }).join("");
 const legend=items.map(item=>`<div class="chart-legend-item"><span class="chart-swatch" style="background:${colors[item.factory]||"#6b6a65"}"></span><span>${escapeHTML(item.factory)}</span><strong>${savingsMoney(item.savings)}</strong></div>`).join("");
 return `<div class="chart-wrap"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="savings-chart" aria-label="${escapeHTML(title||"Chart")}">${paths}</svg><div class="chart-legend">${legend}</div></div>`;
}

 return `<section><div class="section-heading"><h2>Accepted returns awaiting sorting</h2><strong>${total.toLocaleString()} cartons</strong></div><div class="tw"><table><tr>${columns.map(([,label])=>`<th>${label}</th>`).join("")}<th>${lastHeader}</th></tr>${body||`<tr><td class="mu" colspan="${columns.length+1}">No pending cartons</td></tr>`}</table></div></section>`;
}
function render(){
 if(!user)return;
 renderedPeriod=now().slice(0,7);
 const tabs=user.role==="sorting"
  ?["Shift log"]
  :user.role==="seasoning"
  ?["Dashboard","Seasoning dispatch","Return trucks tracking","Sorting at seasoning","Savings YTD"]
  :["Dashboard","Seasoning dispatch","Noodle shift log",user.factory==="OTA"?"Return carton tracking":"Return truck","Sorting at seasoning"];
 if(!tabs.includes(tab))tab=tabs[0];
 $("#nav").innerHTML=tabs.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("")+`<button id="logout">Log out</button>`;
 const kind={"Seasoning dispatch":"dispatch","Shift log":"shifts","Noodle shift log":"shifts","Return truck":"returns","Return carton tracking":"returns","Return trucks tracking":"returns","Sorting at seasoning":"receipts"}[tab];
 let h="";
 if(tab==="Savings YTD"){
  h=renderSavingsYtd();
 }else if(!kind){
  const isSeasoning=user.role==="seasoning";
  const factories=isSeasoning?[selectedFactory]:[user.factory];
  const factoryCards=factories.map(f=>{const s=stats(f),al=s.pile>=thr;
   return `<article class="card factory-card ${al?"alert":""}"><div class="factory-card-head"><strong>${f}</strong>${al?'<span class="badge">Ready to return</span>':'<span class="badge ok">OK</span>'}</div>${acceptanceSummary(s,true)}${returnRateSummary(s)}<div class="factory-total"><span class="mu">Good cartons waiting to return</span><strong>${s.pile.toLocaleString()}</strong></div>${truckEtaSummary(f)}</article>`;
  }).join("");
  h=(isSeasoning?`<section class="dashboard-tools"><label>Factory<select id="dashboardFactory">${F.map(factory=>`<option value="${factory}"${factory===selectedFactory?" selected":""}>${factory}</option>`).join("")}</select></label><label>Alert threshold (good cartons)<input id="thr" type="number" min="0" value="${thr}"></label></section>`:"")+`<div class="section-heading"><h2>${isSeasoning?"Factory overview":user.factory+" dashboard"}</h2></div><div class="grid ${isSeasoning?"factory-grid":""}">${factoryCards}</div>${pendingSortingTable(isSeasoning?selectedFactory:user.factory)}`+(!isSeasoning?`<h2>${user.factory==="OTA"?"Recent carton returns":"Trucks on the way back"}</h2>${rows("returns")}`:"");
 }else{
  const isSeasoningReturnTracking=user.role==="seasoning"&&tab==="Return trucks tracking";
  const isSeasoningReceiptTracking=user.role==="seasoning"&&kind==="receipts";
  const canUpdate=!isSeasoningReturnTracking&&(user.role==="seasoning"||["shifts","returns"].includes(kind));
  const receiptFactoryFilter=isSeasoningReceiptTracking?`<section class="dashboard-tools"><label>Factory<select id="receiptFactory"${editing?.kind==="receipts"?" disabled":""}>${F.map(factory=>`<option value="${factory}"${factory===selectedFactory?" selected":""}>${factory}</option>`).join("")}</select></label></section>`:"";
  const pendingSorting=isSeasoningReceiptTracking?pendingSortingTable(selectedFactory,true):"";
  h=receiptFactoryFilter+pendingSorting+(canUpdate?`<form id="frm">${editing?.kind===kind?`<div style="grid-column:1/-1">Editing log <button type="button" class="edit" id="cancelEdit">Cancel</button></div>`:""}${formHTML(kind)}</form>`:"")+rows(kind,isSeasoningReturnTracking);
 }
 $("#view").innerHTML=h;
 const factorySelect=$("#f_f");
 const dashboardFactorySelect=$("#dashboardFactory");
 if(dashboardFactorySelect)dashboardFactorySelect.onchange=()=>{
  selectedFactory=dashboardFactorySelect.value;
  render();
 };
 const receiptFactorySelect=$("#receiptFactory");
 if(receiptFactorySelect)receiptFactorySelect.onchange=()=>{
  selectedFactory=receiptFactorySelect.value;
  render();
 };
 if(factorySelect&&factorySelect.tagName==="SELECT")factorySelect.onchange=()=>{
  const values=Object.fromEntries([...$("#frm").querySelectorAll("input,select")].filter(input=>!["f_f","f_line"].includes(input.id)).map(input=>[input.id,input.value]));
  selectedFactory=factorySelect.value;
  render();
  for(const [id,value] of Object.entries(values)){const input=$("#"+id);if(input)input.value=value}
 };
 for(const input of $("#view").querySelectorAll("#f_good,#f_bad,#f_rej,#f_wb,#f_used,#f_ph")){
  input.onbeforeinput=event=>{
   if(event.inputType==="insertText"&&event.data&&/\D/.test(event.data))event.preventDefault();
  };
  input.oninput=()=>{
   const caret=input.selectionStart??input.value.length;
   const position=input.value.slice(0,caret).replace(/\D/g,"").length;
   input.value=input.value.replace(/\D/g,"");
   input.setSelectionRange(position,position);
  };
 }
 const driverNameInput=$("#f_driver");
 if(driverNameInput){
  driverNameInput.onbeforeinput=event=>{
   if(event.inputType==="insertText"&&event.data&&/[0-9]/.test(event.data))event.preventDefault();
  };
  driverNameInput.oninput=()=>{
   const caret=driverNameInput.selectionStart??driverNameInput.value.length;
   const position=driverNameInput.value.slice(0,caret).replace(/[0-9]/g,"").length;
   driverNameInput.value=driverNameInput.value.replace(/[0-9]/g,"");
   driverNameInput.setSelectionRange(position,position);
  };
 }
 const truckInput=$("#f_truck");if(truckInput)truckInput.oninput=()=>{
  const caret=truckInput.selectionStart??truckInput.value.length;
  const position=truckInput.value.slice(0,caret).replace(/[^a-z0-9]/gi,"").length;
  truckInput.value=truckInput.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  truckInput.setSelectionRange(position,position);
 };
 if(editing&&editing.kind===kind){
  const record=D[kind].find(item=>item.id===editing.id);
  const isOtaRecord=record?.f==="OTA";
  const fields={dispatch:user.role==="seasoning"?{f:"f_f",dt:"f_month",qty:"f_qty"}:isOtaRecord?{dt:"f_dt",qty:"f_qty"}:{f:"f_f",truck:"f_truck",wb:"f_wb",qty:"f_qty",dt:"f_dt",eta:"f_eta"},shifts:user.role==="sorting"?{f:"f_f",date:"f_date",line:"f_line",sh:"f_sh",good:"f_good",bad:"f_bad",sorter:"f_sorter"}:{f:"f_f",date:"f_date",line:"f_line",sh:"f_sh",used:"f_used"},returns:isOtaRecord?{f:"f_f",qty:"f_qty",dt:"f_dt"}:{f:"f_f",truck:"f_truck",driver:"f_driver",ph:"f_ph",wb:"f_wb",qty:"f_qty",dt:"f_dt",eta:"f_eta"},receipts:{rid:"f_rid",acceptedAt:"f_acceptedAt",acc:"f_acc",rej:"f_rej",dt:"f_dt"}}[kind];
  if(record)for(const [key,id] of Object.entries(fields)){const input=$("#"+id);if(input){const value=key==="acceptedAt"?record.acceptedAt||record.dt:record[key];input.value=key==="truck"?String(value??"").toUpperCase().replace(/[^A-Z0-9]/g,""):key==="driver"?String(value??"").replace(/[0-9]/g,""):id==="f_month"?String(value??"").slice(0,7):value??""}}
  const submit=$("#frm .go");if(submit)submit.textContent=kind==="receipts"&&!isSortedReceipt(record)?"Complete sorting":"Save changes";
 }
 document.querySelectorAll("nav button[data-t]").forEach(b=>b.onclick=()=>{editing=null;tab=b.dataset.t;render()});
 const logout=$("#logout");logout.onclick=()=>{token="";user=null;applyThemeForCurrentUser();editing=null;sessionStorage.removeItem("carton_token");$("#loginMsg").textContent="You have been logged out.";setAuthenticated(false)};
 const t=$("#thr");if(t)t.onchange=async()=>{
  thr=+t.value||0;render();
  try{
   await api("POST",{kind:"settings",rec:{thr,savingsByMonth}});
  }catch(error){$("#msg").textContent="Settings update failed: "+error.message}
 };
 const saveSavings=$("#saveSavings");if(saveSavings)saveSavings.onclick=async()=>{
  const next={};
  for(const input of $("#view").querySelectorAll("input[data-sav-month][data-sav-field]")){
   const month=input.dataset.savMonth,field=input.dataset.savField,value=input.value===""?0:+input.value;
   if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!["wac","sortingCost","haulagePhc","haulageKaduna"].includes(field)){ $("#msg").textContent="Savings inputs could not be read. Refresh and try again."; return; }
   if(!Number.isFinite(value)||value<0){ $("#msg").textContent="Monthly savings inputs must be numbers greater than or equal to zero"; return; }
   if(value===0)continue;
   next[month]={...(next[month]||{}),[field]:value};
  }
  try{
   await api("POST",{kind:"settings",rec:{thr,savingsByMonth:next}});
   await load();
   $("#msg").textContent=storageMessage("Monthly savings inputs saved");
  }catch(error){$("#msg").textContent="Savings update failed: "+error.message}
 };
 const fm=$("#frm");if(fm)fm.onsubmit=async e=>{
  e.preventDefault();
  const currentEdit=editing?.kind===kind?editing:null;
  try{
   await api("POST",currentEdit?{action:"edit",kind,id:currentEdit.id,rec:rec(kind)}:{kind,rec:rec(kind)});
   editing=null;
   await load();
   $("#msg").textContent=storageMessage(currentEdit?"Log updated":"Log saved");
  }catch(x){$("#msg").textContent=(currentEdit?"Edit":"Save")+" failed: "+x.message}
 };
 const cancelEdit=$("#cancelEdit");if(cancelEdit)cancelEdit.onclick=()=>{editing=null;render()};
 $("#view").querySelectorAll("button[data-log-action]").forEach(button=>button.onclick=async()=>{
  const action=button.dataset.logAction,kind=button.dataset.logKind,id=button.dataset.logId;
  const record=D[kind].find(item=>item.id===id);
  if(!record){$("#msg").textContent="Action failed: record not found. Refresh and try again.";return}
  if(action==="edit"){
   editing={kind,id};
   if(user.role==="seasoning"){
    const recordFactory=kind==="receipts"?D.returns.find(returnRecord=>returnRecord.id===record.rid)?.f:record.f;
    if(recordFactory)selectedFactory=recordFactory;
   }
   tab=({dispatch:"Seasoning dispatch",shifts:user.role==="sorting"?"Shift log":"Noodle shift log",returns:user.role==="seasoning"?"Return trucks tracking":record.f==="OTA"?"Return carton tracking":"Return truck",receipts:"Sorting at seasoning"})[kind];
   render();
   return;
  }
  const detail=kind==="returns"
   ?" Any sorting receipt for this return will also be deleted."
   :kind==="shifts"?" This removes both the sorter counts and warehouse total for the whole shift.":"";
  if(!window.confirm(`Delete this ${kind==="shifts"?"shift":kind==="returns"?"return truck":kind==="receipts"?"sorting":"dispatch"} log? This cannot be undone.${detail}`))return;
  button.disabled=true;
  try{
   await api("POST",{action:"delete",kind,id});
   editing=null;
   await load();
   $("#msg").textContent=storageMessage("Log deleted");
  }catch(error){
   $("#msg").textContent="Delete failed: "+error.message;
   button.disabled=false;
  }
 });
}
async function api(m,body,authenticate=true){
 const headers={"content-type":"application/json"};
 if(authenticate&&token)headers.authorization=`Bearer ${token}`;
 const r=await fetch("/api/handler",{method:m,headers,body:body?JSON.stringify(body):undefined});
 if(!r.ok){const error=new Error(await r.text());error.status=r.status;throw error}
 return r.json()
}
$("#loginForm").onsubmit=async e=>{
 e.preventDefault();
 try{
  const result=await api("POST",{action:"login",plant:$("#plant").value,team:$("#team").value,password:$("#password").value},false);
  token=result.token;user=result.user;applyThemeForCurrentUser();sessionStorage.setItem("carton_token",token);
  $("#password").value="";$("#password").type="password";$("#passwordToggle").setAttribute("aria-label","Show password");$("#passwordToggle").setAttribute("aria-pressed","false");$("#passwordEyeSlash").hidden=true;$("#plant").value="";$("#loginMsg").textContent="";setAuthenticated(true);$("#msg").textContent="";tab="Dashboard";await load();
 }catch(error){$("#loginMsg").textContent=error.message}
};
async function load(){
 if(!token){setAuthenticated(false);return}
 try{
  const d=await api("GET");C.forEach(k=>D[k]=(d[k]||[]).map(normalizeFactoryRecord));user=d.user;applyThemeForCurrentUser();
  if(d.settings&&d.settings.thr!=null)thr=d.settings.thr;
  savingsByMonth=(d.settings&&typeof d.settings.savingsByMonth==="object"&&!Array.isArray(d.settings.savingsByMonth))?d.settings.savingsByMonth:{};
  setAuthenticated(true);$("#msg").textContent="";
  const el=document.activeElement,periodChanged=now().slice(0,7)!==renderedPeriod;
  if(!el||!/INPUT|SELECT/.test(el.tagName)||(periodChanged&&tab==="Dashboard"))render();
 }catch(error){
  if(error.status===401){token="";user=null;applyThemeForCurrentUser();editing=null;sessionStorage.removeItem("carton_token");$("#loginMsg").textContent="Your session expired. Please sign in again.";setAuthenticated(false);return}
  $("#msg").textContent=error.message;
 }
}
setAuthenticated(false);load();setInterval(load,15000);
